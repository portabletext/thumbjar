name: "Demo: Slate vs PTE"

# Scratch measurement, never merged: types the same scenarios on real Gboard into a minimal Slate editor,
# a minimal Portable Text Editor and a plain `contenteditable` control (`demo/`), and uploads `demo/out`,
# whose `results.jsonl` holds one line per test. Each attempt is a separate job on a fresh emulator, so
# `RUNS` repeats the whole matrix.
#
# The `record` and `compose` jobs run the Enter scene (`demo/tests/scene.ts`): `hello` Space `world` Space,
# Gboard's Enter, `hello` Space `again` Space, 3 runs per editor on the android-37.0 image, the first one
# recorded on screen, and put the two recordings side by side in the `slate-vs-pte` artifact.

on:
  # `workflow_dispatch` cannot start a workflow that exists only on a non-default branch, so a push to
  # this branch runs it.
  push:
    branches: [demo/slate-vs-pte]
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run each editor and keyboard, RUNS below when empty
        type: string
        required: false

env:
  # How many times each editor and keyboard runs on a push. Edit to change.
  RUNS: 3
  # MEASURE: the measurement (`attempts` and `android`) is off while the recording is the point. `env` cannot
  # be read in a job's `if:`, so the switch is the literal `if: ${{ false }}` on those two jobs; set both to
  # `true` to measure again.

# A newer push replaces the measurement of an older one.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attempts:
    # MEASURE: off. Skipping this job also skips `android`, which needs it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          RUNS: ${{ inputs.runs || env.RUNS }}
        run: |
          if ! [[ "$RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "runs must be a positive integer, got '$RUNS'" >&2
            exit 1
          fi
          echo "list=$(seq -s, 1 "$RUNS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  android:
    name: ${{ matrix.editor }} ${{ matrix.lang }} (${{ matrix.attempt }})
    needs: attempts
    # MEASURE: off.
    if: ${{ false }}
    runs-on: ubuntu-latest
    # The run step's cap plus room for the steps around it (install, builds, jar fetch, upload).
    timeout-minutes: ${{ matrix.jobMinutes }}

    strategy:
      fail-fast: false
      matrix:
        editor: [slate, pte, plain]
        lang: [ja, en]
        attempt: ${{ fromJSON(needs.attempts.outputs.list) }}
        # `runMinutes` covers `runStepWorstSeconds` from `thumbjar/vitest` for the row's file, rounded up:
        # 4144 seconds for `ja` with 4 tests, 5399 for `en` with 6 and 3416 for plain `en` with 3.
        include:
          - {lang: ja, runMinutes: 70, jobMinutes: 100}
          - {lang: en, runMinutes: 90, jobMinutes: 120}
          - {editor: plain, lang: en, runMinutes: 57, jobMinutes: 90}

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project dependencies
        timeout-minutes: 8
        run: pnpm install

      - name: Build thumbjar
        timeout-minutes: 5
        run: pnpm build

      - name: Install and build the demo pages
        timeout-minutes: 8
        working-directory: demo
        run: |
          npm ci
          npm run build
          # thumbjar run warms Gboard and checks the dictionary on page/editor.html; use the plain control for that.
          cp page/plain.html page/editor.html

      - name: Fetch the uiautomator2 server jar
        timeout-minutes: 4
        working-directory: demo
        run: node ../bin/thumbjar.js fetch-u2-jar

      - name: Run on emulator
        timeout-minutes: ${{ matrix.runMinutes }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          # Emulator 37.2.12, as in portabletext/editor: 37.2.13 crashes during guest process cleanup.
          emulator-build: 16428233
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 360
          working-directory: demo
          script: node ../bin/thumbjar.js run tests/${{ matrix.editor }}.${{ matrix.lang }}.test.ts --keyboard ${{ matrix.lang }} --page-dir page --config vitest.config.ts --project device --out-dir out

      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: demo-${{ matrix.editor }}-${{ matrix.lang }}-${{ matrix.attempt }}
          path: demo/out/

  probe:
    # The PTE playground first-word question: `demo/tests/probe.ts` taps into an empty editor and types
    # `hello` Space `world` Space, 3 runs of each case (demo PTE with and without the playground's
    # placeholder and initial value, a plain control and https://playground.portabletext.org/), and records
    # Gboard's Shift state before the first letter. Results in `out/probe-results.jsonl`, evidence per run in
    # `out/probe/<case>-<run>/`, Chrome and Gboard versions in `out/probe-versions.txt`.
    name: probe android-${{ matrix.api }}
    # On: EDEX-3359, the editor with the placeholder after the text span and margin-top -1lh (`demo/vendor/`). Run 46009695901 is the before.
    runs-on: ubuntu-latest
    # `runStepWorstSeconds('en', 6)` is 5399 s; the file's own cap is 4066 s.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # 37.0 is the newest x86_64 Play Store image without 16 KB pages. It needs emulator 37.2.11 or later
        # (its `emulator` dependency in Google's sys-img2 repository), which the pinned 37.2.12 meets.
        api: ["36", "37.0"]

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project dependencies
        timeout-minutes: 8
        run: pnpm install

      - name: Build thumbjar
        timeout-minutes: 5
        run: pnpm build

      - name: Install and build the demo pages
        timeout-minutes: 8
        working-directory: demo
        run: |
          npm ci
          npm run build
          # thumbjar run warms Gboard and checks the dictionary on page/editor.html; use the plain control for that.
          cp page/plain.html page/editor.html

      - name: Fetch the uiautomator2 server jar
        timeout-minutes: 4
        working-directory: demo
        run: node ../bin/thumbjar.js fetch-u2-jar

      - name: Probe on emulator
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          # Emulator 37.2.12, as in portabletext/editor: 37.2.13 crashes during guest process cleanup.
          emulator-build: 16428233
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 360
          working-directory: demo
          script: PROBE_CASES=plain,pte,pte-placeholder,pte-placeholder-uninitialised node ../bin/thumbjar.js run tests/probe.test.ts --keyboard en --page-dir page --config vitest.config.ts --project device --out-dir out

      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: probe-android-${{ matrix.api }}
          path: demo/out/

  record:
    # Off while the probe checks EDEX-3359; `compose` needs it and skips too.
    if: ${{ false }}
    name: record ${{ matrix.editor }}
    runs-on: ubuntu-latest
    # `runStepWorstSeconds('en', 4)` from `thumbjar/vitest` is 4077 seconds: the record files declare four
    # tests so the file's cap (2744 s) covers the version record and three scene runs of at most 360 s
    # (see `demo/tests/scene.ts`). The job adds room for install, builds, jar fetch and upload.
    timeout-minutes: 110

    strategy:
      fail-fast: false
      matrix:
        editor: [slate, pte]

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project dependencies
        timeout-minutes: 8
        run: pnpm install

      - name: Build thumbjar
        timeout-minutes: 5
        run: pnpm build

      - name: Install and build the demo pages
        timeout-minutes: 8
        working-directory: demo
        run: |
          npm ci
          npm run build
          # thumbjar run warms Gboard and checks the dictionary on page/editor.html; use the plain control for that.
          cp page/plain.html page/editor.html

      - name: Fetch the uiautomator2 server jar
        timeout-minutes: 4
        working-directory: demo
        run: node ../bin/thumbjar.js fetch-u2-jar

      - name: Record on emulator
        timeout-minutes: 80
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Chrome 145 and Gboard 17.2 come preinstalled on this image (run 46009695901). It needs emulator
          # 37.2.11 or later, which the pinned 37.2.12 meets.
          api-level: "37.0"
          target: google_apis_playstore
          arch: x86_64
          # Emulator 37.2.12, as in portabletext/editor: 37.2.13 crashes during guest process cleanup.
          emulator-build: 16428233
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 360
          working-directory: demo
          script: node ../bin/thumbjar.js run tests/record.${{ matrix.editor }}.test.ts --keyboard en --page-dir page --config vitest.config.ts --project device --out-dir out

      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: record-${{ matrix.editor }}
          path: demo/out/

  compose:
    needs: record
    # Runs only when both recordings succeeded: `needs` already skips this job when either failed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: record-*
          path: records

      - name: Install ffmpeg if missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Put Slate and PTE side by side
        run: |
          slate=records/record-slate/record-slate.mp4
          pte=records/record-pte/record-pte.mp4
          ls -l "$slate" "$pte"
          duration() { ffprobe -v error -show_entries format=duration -of csv=p=0 "$1"; }
          # The longer of the two, so the shorter one holds its last frame until the longer one ends.
          longest=$(printf '%s\n%s\n' "$(duration "$slate")" "$(duration "$pte")" | sort -g | tail -1)
          echo "slate $(duration "$slate") s, pte $(duration "$pte") s, output $longest s"
          # Both to 30 fps and 1200 px high (screenrecord gives a variable frame rate), the shorter one
          # padded with its last frame, Slate left and PTE right.
          ffmpeg -y -i "$slate" -i "$pte" -filter_complex \
            "[0:v]fps=30,scale=-2:1200,setsar=1,tpad=stop_mode=clone:stop_duration=600[l];[1:v]fps=30,scale=-2:1200,setsar=1,tpad=stop_mode=clone:stop_duration=600[r];[l][r]hstack=inputs=2[v]" \
            -map '[v]' -t "$longest" -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart slate-vs-pte.mp4
          ls -l slate-vs-pte.mp4

      - uses: actions/upload-artifact@v7
        with:
          name: slate-vs-pte
          path: slate-vs-pte.mp4
