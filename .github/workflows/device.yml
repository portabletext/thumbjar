name: Device tests

# Types on real Gboard in an Android emulator into the pages in `e2e/page`, so thumbjar's own CI
# shows it both passes a correct page and catches a page with a planted input bug. Each job runs the
# `android/` action from this checkout, which boots a fresh emulator, prepares it for its row's language with
# `thumbjar ci android run` and runs that row's test file, once more on a fresh emulator when the first never booted,
# lost adb or never loaded Gboard's Japanese dictionary.
# Not a required check.

on:
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (${{ matrix.lang }})
    runs-on: ubuntu-latest
    # The `ja` row's action cap plus room for the steps before it.
    timeout-minutes: 164

    strategy:
      fail-fast: false
      matrix:
        # A run's cap covers `runStepWorstSeconds` from `thumbjar/vitest` for the row's file: 62 minutes for
        # `ja` with 3 tests (59 worst) and 50 for `en` with 2 (46 worst). Composite steps take no cap of their own,
        # so `actionMinutes` covers two runs, as with a retry, plus 4 for the jar, 9 for the emulator install, 5 for
        # the upload and 1 for the rest.
        include:
          - {lang: ja, actionMinutes: 143}
          - {lang: en, actionMinutes: 119}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project dependencies
        timeout-minutes: 8
        run: pnpm install

      - name: Build thumbjar and the test pages
        timeout-minutes: 5
        run: |
          pnpm build
          pnpm build:e2e

      # KVM, the uiautomator2 jar, the pinned emulator's verified install, the emulator run with one retry when the first
      # emulator fails as infrastructure, and the `e2e/out/` upload.
      - name: Run on emulator
        timeout-minutes: ${{ matrix.actionMinutes }}
        uses: ./android
        with:
          test: tests/${{ matrix.lang }}.test.ts
          keyboard: ${{ matrix.lang }}
          working-directory: e2e
          page-dir: page
          artifact-name: device-android-${{ matrix.lang }}-${{ github.run_attempt }}
