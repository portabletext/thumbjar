name: thumbjar Android
description: Run a thumbjar device test file on real Gboard in an Android emulator, retrying once on a fresh emulator when the first one fails as infrastructure.

# Run after checkout, Node setup, the install that brings in `thumbjar` and the build of the page under test. The
# emulator runner owns the emulator, so a second boot needs a second runner step: `thumbjar ci android retry` decides
# from `timing.txt` whether the first run failed as infrastructure, and only then does the second step run.
#
# Composite steps take no `timeout-minutes`: put it on the step that uses this action, covering two runs.
#
# The system image comes from the actions cache when a run on the default branch saved it, keyed by the revision
# `sdkmanager` would install now, so the runner's install finds it current. A failed lookup or restore installs as on
# a miss, and a failed save only skips the cache. After the runs, `thumbjar ci android check-emulator` fails the action
# unless the SDK's emulator, the one the runner launched, is the pinned `emulator-build`.

inputs:
  test:
    description: The device test file, relative to `working-directory`.
    required: true
  keyboard:
    description: The keyboard to prepare, `ja` or `en`.
    required: true
  working-directory:
    description: The package to run in, the one that depends on `thumbjar` and holds the Vitest config.
    default: .
  page-dir:
    description: The built page directory `thumbjar serve` serves, relative to `working-directory`.
    default: dist
  config:
    description: The Vitest config, relative to `working-directory`.
    default: vitest.config.ts
  project:
    description: The Vitest project with the device tests.
    default: device
  out-dir:
    description: Where thumbjar writes its diagnostics, relative to `working-directory`. Uploaded as an artifact.
    default: out
  artifact-name:
    description: The artifact's name, `thumbjar-android-<keyboard>-<run attempt>` unless given. Give each job its own.
    default: ""
  api-level:
    description: The emulator's Android API level.
    default: "36"
  emulator-build:
    description: The emulator build to install.
    # Emulator 37.2.12, as in portabletext/editor: 37.2.13 crashes during guest process cleanup.
    default: "16428233"

runs:
  using: composite
  steps:
    - name: Enable KVM group perms
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Fetch the uiautomator2 server jar
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no thumbjar fetch-u2-jar

    - name: Look up the SDK cache key
      id: sdk-key
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2> /dev/null | npx --no thumbjar ci android sdk-cache-key --api "${{ inputs.api-level }}" >> "$GITHUB_OUTPUT"

    - name: Restore the SDK cache
      id: sdk-restore
      if: steps.sdk-key.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ steps.sdk-key.outputs.key }}
        path: ${{ steps.sdk-key.outputs.path }}

    # The key lookup gives a key only when the SDK had no image, so anything at the path without an exact hit is what
    # a restore left when it failed part way, which `actions/cache` reports as a warning and a miss. Deleting it keeps
    # `sdkmanager` from taking a partial image for installed.
    - name: Clear a missed SDK restore
      if: steps.sdk-key.outputs.key != '' && steps.sdk-restore.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf "${{ steps.sdk-key.outputs.path }}"

    - name: Run on emulator
      id: run1
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis_playstore
        arch: x86_64
        emulator-build: ${{ inputs.emulator-build }}
        profile: pixel_6
        disable-animations: true
        ram-size: 4096M
        cores: 4
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        emulator-boot-timeout: 360
        working-directory: ${{ inputs.working-directory }}
        script: npx --no thumbjar ci android run "${{ inputs.test }}" --keyboard "${{ inputs.keyboard }}" --page-dir "${{ inputs.page-dir }}" --config "${{ inputs.config }}" --project "${{ inputs.project }}" --out-dir "${{ inputs.out-dir }}"

    # The emulator sometimes never comes online, adb loses it after boot, or Gboard's Japanese dictionary never loads
    # on that boot. Exits 0 to retry once on a fresh emulator then, never after a test failure on a reachable device.
    - name: Decide the retry
      id: retry
      if: steps.run1.outcome == 'failure'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no thumbjar ci android retry --out-dir "${{ inputs.out-dir }}"

    - name: Run on emulator (retry)
      id: run2
      if: steps.retry.outcome == 'success'
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis_playstore
        arch: x86_64
        emulator-build: ${{ inputs.emulator-build }}
        profile: pixel_6
        disable-animations: true
        ram-size: 4096M
        cores: 4
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        emulator-boot-timeout: 360
        working-directory: ${{ inputs.working-directory }}
        script: npx --no thumbjar ci android run "${{ inputs.test }}" --keyboard "${{ inputs.keyboard }}" --page-dir "${{ inputs.page-dir }}" --config "${{ inputs.config }}" --project "${{ inputs.project }}" --out-dir "${{ inputs.out-dir }}"

    # The runner downloads `emulator-build` and unpacks it over the latest emulator in `$ANDROID_HOME/emulator`, which
    # it launches. A failed download or unpack would leave the latest, which may be the build that crashes.
    - name: Check the pinned emulator
      id: emulator-check
      if: always() && inputs.emulator-build != '' && steps.run1.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --no thumbjar ci android check-emulator --build "${{ inputs.emulator-build }}"

    # Only the default branch saves, so pull requests read its entry and add none. A scheduled run always runs on the
    # default branch but its event carries no `repository`, so it is matched by its event name. Only an image that
    # booted an emulator through a passing run on the pinned emulator is saved, never one a cut-off install left
    # incomplete.
    - name: Save the SDK cache
      if: >-
        always() && steps.sdk-key.outputs.key != '' && steps.sdk-restore.outputs.cache-hit != 'true'
        && (steps.run1.outcome == 'success' || steps.run2.outcome == 'success')
        && (inputs.emulator-build == '' || steps.emulator-check.outcome == 'success')
        && (github.event_name == 'schedule'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.sdk-key.outputs.key }}
        path: ${{ steps.sdk-key.outputs.path }}

    - name: Upload the diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name || format('thumbjar-android-{0}-{1}', inputs.keyboard, github.run_attempt) }}
        path: ${{ inputs.working-directory }}/${{ inputs.out-dir }}/

    # The run steps continue on error so the retry can follow. This fails the action when the last run failed.
    - name: Result
      if: always() && steps.run1.outcome == 'failure' && steps.run2.outcome != 'success'
      shell: bash
      run: |
        echo "::error::thumbjar failed on the emulator${{ steps.run2.outcome == 'failure' && ', on the retry too' || '' }}, see the run step's log and the uploaded diagnostics"
        exit 1
